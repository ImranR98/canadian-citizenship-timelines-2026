<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Citizenship Timelines</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>Canadian Citizenship Timelines <span class="badge" id="header-count"></span></h1>
  </header>

  <main>
    <div id="stats-bar"></div>

    <div id="filter-card">
      <div id="filter-row">
        <div class="filter-group">
          <label>From</label>
          <input type="date" id="filter-from">
        </div>
        <div class="filter-group">
          <label>To</label>
          <input type="date" id="filter-to">
        </div>
        <span class="sep"></span>
        <span class="filter-check" data-field="aor_date">AOR</span>
        <span class="filter-check" data-field="background_check_date">BG</span>
        <span class="filter-check" data-field="test_completed_date">Test</span>
        <span class="filter-check" data-field="lpp_date">LPP</span>
        <span class="filter-check" data-field="oath_ceremony_date">Oath</span>
        <span class="sep"></span>
        <div class="filter-group">
          <select id="sort-field"></select>
        </div>
        <button class="btn" id="sort-dir">DESC ▼</button>
        <button class="btn" id="cols-btn">⚙ Columns</button>
        <button class="btn" id="clear-btn">✕ Clear</button>
      </div>
    </div>

    <div id="cols-popup"></div>

    <div id="content">
      <div id="table-wrap">
        <div id="loading-state"><div class="spinner"></div><p>Loading timelines...</p></div>
        <div id="error-state" class="hidden"></div>
        <div id="empty-state" class="hidden"><h3>No data yet</h3><p>Run <code>node main.js</code> to scrape and process the comments.</p></div>
        <table id="table" class="hidden">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <aside id="detail-panel" class="hidden">
        <div id="panel-header">
          <h3 id="panel-title"></h3>
          <button id="close-panel">✕</button>
        </div>
        <div id="detail-body"></div>
      </aside>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
