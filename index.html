<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Citizenship Timelines</title>
  <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>Canadian Citizenship Timelines <span class="badge" id="header-count"></span></h1>
  </header>

  <main>
    <div id="stats-bar"></div>

    <div id="filter-card">
      <div id="filter-row">
        <div class="filter-section">
          <span class="filter-label">Application date</span>
          <input type="date" id="filter-from" placeholder="From">
          <span class="filter-range-sep">to</span>
          <input type="date" id="filter-to" placeholder="To">
        </div>

        <div class="filter-section">
          <span class="filter-label">Must have passed</span>
          <span class="filter-check" data-field="aor_date">AOR</span>
          <span class="filter-check" data-field="background_check_date">Background</span>
          <span class="filter-check" data-field="test_completed_date">Test</span>
          <span class="filter-check" data-field="lpp_date">LPP</span>
          <span class="filter-check" data-field="oath_ceremony_date">Oath</span>
        </div>

        <div class="filter-section">
          <span class="filter-label">Sort by</span>
          <select id="sort-field"></select>
          <button class="btn" id="sort-dir">Newest first</button>
        </div>

        <div class="filter-section filter-actions">
          <button class="btn" id="cols-btn">Columns</button>
          <button class="btn" id="clear-btn">Reset</button>
        </div>
      </div>
    </div>

    <div id="cols-popup"></div>

    <div id="content">
      <div id="table-wrap">
        <div id="loading-state"><div class="spinner"></div><p>Loading timelines...</p></div>
        <div id="error-state" class="hidden"></div>
        <div id="empty-state" class="hidden"><h3>No data yet</h3><p>Run <code>node main.js</code> to scrape and process the comments.</p></div>
        <div id="table"></div>
      </div>

      <aside id="detail-panel" class="hidden">
        <div id="panel-header">
          <h3 id="panel-title"></h3>
          <button id="close-panel">✕</button>
        </div>
        <div id="detail-body"></div>
      </aside>
    </div>
  </main>

  <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
